name: Run API and save curl outputs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'final_project/index.js'
      - 'final_project/router/**'
      - 'final_project/package.json'
      - 'final_project/run_curls.sh'
      - '.github/workflows/curl-outputs.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: final_project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Start server
        run: |
          nohup node index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -s http://localhost:5000/ > /dev/null && break; sleep 1; done
      - name: Run curl commands
        run: bash run_curls.sh
      - name: Commit outputs
        run: |
          git config user.name "Dareen Alalyani"
          git config user.email "dareen-ui@users.noreply.github.com"
          git add getallbooks getbooksbyISBN getbooksbyauthor getbooksbytitle getbookreview register login reviewadded deletereview asyncaxios
          git commit -m "Save curl outputs [skip ci]" || echo "No changes"
          git push
